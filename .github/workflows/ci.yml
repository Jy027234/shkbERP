name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Java 25
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: erp-backend/pom.xml

      - name: Verify Maven reactor
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend / Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp-frontend
    env:
      HUSKY: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install frozen dependencies
        run: npx --yes pnpm@9.15.9 install --frozen-lockfile

      - name: Type check
        run: npx --yes pnpm@9.15.9 type:check

      - name: Run unit tests
        run: npx --yes pnpm@9.15.9 test

      - name: Build production assets
        run: npx --yes pnpm@9.15.9 build

